[package]
name = "engine"
description = "lovelyDL engine: toolchain, yt-dlp driver, queue, store and settings. No Tauri."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "system-proxy", "json"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
sha2 = "0.11.1"
trash = "5.3.0"
url = "2.5.8"
zip = { version = "9.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.27.0"
tiny_http = "0.12.0"
