[workspace]
resolver = "3"
members = ["crates/engine", "crates/fake-ytdlp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-or-later"
repository = "https://github.com/FlyShip09/lovelyDL"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs"] }
tracing = "0.1.44"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
